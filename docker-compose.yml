services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - '5433:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./apps/server/scripts/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER}']
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - '${REDIS_PORT:-6379}:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 10s
      timeout: 5s
      retries: 5

  browser:
    build:
      context: .
      dockerfile: apps/server/Dockerfile.browser
    restart: unless-stopped
    expose:
      - '4444'
    shm_size: '1g'

  server:
    build:
      context: .
      dockerfile: apps/server/Dockerfile.dev
    restart: unless-stopped
    ports:
      - '3000:3000'
    environment:
      NODE_ENV: development
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_USER: ${POSTGRES_USER}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD}
      DATABASE_DB: ${POSTGRES_DB}
      CORS_ORIGINS: '*'
      REDIS_HOST: redis
      REDIS_PORT: 6379
      STORAGE_PROVIDER: local-docker
      STORAGE_PATH: /app/data/storage
      PUBLIC_URL: http://${HOST_IP:-localhost}:${APP_PORT:-3000}
      BROWSER_URL: ws://browser:4444/camoufox
    volumes:
      - ./apps/server:/app/apps/server
      - node_modules:/app/node_modules
      - storage_data:/app/data/storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile.dev
    restart: unless-stopped
    ports:
      - '3001:3001'
    environment:
      VITE_API_URL: http://localhost:3000
    volumes:
      - ./apps/web:/app/apps/web
      - /app/apps/web/node_modules
    depends_on:
      - server

volumes:
  postgres_data:
  redis_data:
  node_modules:
  storage_data:
