name: Demo DB Reset

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

concurrency:
  group: demo-db-reset
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  reset:
    name: Reset demo database
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NODE_ENV: production
      DEMO_MODE: true
      DATABASE_URL: ${{ secrets.DEMO_DATABASE_URL }}
      JWT_SECRET: ${{ secrets.DEMO_JWT_SECRET }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.28.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Migrate demo database
        run: pnpm --filter server db:migrate

      - name: Reset demo database
        run: pnpm --filter server demo:reset
