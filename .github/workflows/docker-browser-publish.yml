name: Docker Publish Browser

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/docker-browser-publish.yml
      - apps/server/Dockerfile.browser
      - apps/server/browser/**
  push:
    branches: [main]
    tags: ['v*.*.*']
    paths:
      - .github/workflows/docker-browser-publish.yml
      - apps/server/Dockerfile.browser
      - apps/server/browser/**
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_OWNER: technowizard
  IMAGE_NAME: loreo-browser

permissions:
  contents: read
  packages: write

jobs:
  docker:
    name: Build loreo-browser
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        timeout-minutes: 5
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and publish
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/server/Dockerfile.browser
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ env.IMAGE_NAME }}
          cache-to: type=gha,mode=max,scope=${{ env.IMAGE_NAME }}
